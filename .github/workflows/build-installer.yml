name: Build installer

# Started by hand from the Actions tab. Produces the same single
# "BlackICE <version> Setup.exe" that installer/buildInstaller.py builds
# locally - nothing to extract, no zip inside a zip.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the build, e.g. 15.2. "GitHub" for a test build.'
        required: true
        default: 'GitHub'
      engine:
        description: 'The OpenHOI3 engine to ship. auto: the newest build for the test build "GitHub", the release the mod names for any other version.'
        type: choice
        options:
          - auto
          - named
          - latest
        default: auto
      bundle_runtimes:
        description: 'Bundle the Microsoft runtimes (C++, DirectX). Adds ~56 MB and a few minutes.'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    # LZMA2 over the 2.4 GB mod tree is slow on a two core runner. The build
    # takes well under this, but a timeout that bites halfway through a
    # compression pass wastes the whole run.
    timeout-minutes: 120

    steps:
      - name: Check out the mod
        uses: actions/checkout@v4
        with:
          # The working tree is what gets packaged; the history is 2 GB of files
          # we would only throw away.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        # buildInstaller.py finds ISCC.exe through Inno's registry entry and
        # falls back to the standard install paths, so nothing needs configuring.
        run: choco install innosetup --no-progress --yes

      - name: Check the compiler was found
        # Fails here with one clear line rather than deep inside the build if
        # Chocolatey ever moves where it installs Inno.
        run: |
          python -c "import sys; sys.path.insert(0, 'installer'); import buildInstaller; p = buildInstaller.findIscc(); print('ISCC:', p or 'NOT FOUND'); sys.exit(0 if p else 1)"

      - name: Fetch the Microsoft runtimes
        if: ${{ inputs.bundle_runtimes }}
        # Downloaded from Microsoft, not committed. Without this step the build
        # still succeeds; the installer then reports what is missing on the
        # system check page instead of installing it.
        run: python installer/fetchRedists.py

      - name: Choose the OpenHOI3 engine
        # A test build - the version "GitHub" - ships the engine's rolling build,
        # the release "latest" that OpenHOI3's own pipeline makes again at every
        # change to its main branch. Any other version ships the release named in
        # releaseCommon.ENGINE_VERSION, which stays as it is. The input overrides
        # either way: "latest" for a release candidate on an engine not yet
        # released, "named" for a test build on the released one.
        id: engine
        shell: pwsh
        run: |
          $engine = '${{ inputs.engine }}'
          if ($engine -eq 'auto') {
            $engine = if ('${{ inputs.version }}' -eq 'GitHub') { 'latest' } else { 'named' }
          }
          "The engine: $engine"
          "which=$engine" >> $env:GITHUB_OUTPUT

      - name: Fetch the OpenHOI3 engine
        # From that project's GitHub releases, checked against the release's
        # SHA256SUMS.txt. Not committed either - about 100 MB to download. A
        # core part of a release, so unlike the runtimes there is no switch for
        # leaving it out here, and the build below stops without it.
        shell: pwsh
        run: |
          if ('${{ steps.engine.outputs.which }}' -eq 'latest') {
            python installer/fetchEngine.py --latest
          } else {
            python installer/fetchEngine.py
          }

      - name: Build the installer
        # --any-engine where the rolling build was chosen for a version that is no
        # test build: the build would otherwise stop at an engine the mod does not name.
        shell: pwsh
        run: |
          if ('${{ steps.engine.outputs.which }}' -eq 'latest') {
            python installer/buildInstaller.py "${{ inputs.version }}" --any-engine
          } else {
            python installer/buildInstaller.py "${{ inputs.version }}"
          }

      - name: Show what was built
        run: |
          Get-ChildItem "installer/output" |
            Select-Object Name, @{n='MB';e={[int]($_.Length / 1MB)}} |
            Format-Table -AutoSize

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: BlackICE ${{ inputs.version }} Setup
          path: installer/output/BlackICE ${{ inputs.version }} Setup.exe
          # The exe is already LZMA2 compressed, so zipping it again buys
          # nothing and costs several minutes of upload time.
          compression-level: 0
          if-no-files-found: error
          # Costs nothing while this repo is public - Actions minutes and
          # artifact storage are both free for public repositories on standard
          # runners - but the default is 90 days, and a ~920 MB artifact per run
          # is worth clearing sooner. It also means that if the repo were ever
          # made private, these would not quietly eat the storage allowance
          # (500 MB on the Free plan, so one build would exceed it).
          retention-days: 30
