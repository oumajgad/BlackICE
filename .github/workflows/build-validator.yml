name: Build BICE Validator

# Builds tools/BiceValidator into BiceValidator.exe, which runs without Python, and the
# BlackICE Script extension for VS Code, tries both, and uploads them as the run's
# artifacts. Runs by itself when the validator changes on master, and can be started by
# hand from the Actions tab. What everyone runs is what is committed in
# tools/BiceValidator/dist; this is the check that the source still builds into it.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/BiceValidator/**'
      - 'docs/script/**'
      - '.github/workflows/build-validator.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out what the validator reads
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The smoke test validates the real mod, but only its script folders - not
          # the gigabytes of textures and models under gfx/, apart from the flags.
          sparse-checkout: |
            tools/BiceValidator
            docs
            events
            decisions
            common
            history
            technologies
            units
            map
            interface
            localisation
            script
            gfx/flags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PySide6, PyInstaller and pygls
        run: python -m pip install -r tools/BiceValidator/requirements-build.txt

      - name: Run the tests
        working-directory: tools/BiceValidator
        run: python -m unittest discover -s tests -t .

      - name: Build and try the exe
        # build.py builds dist/BiceValidator.exe, then has the exe validate this checkout
        # through its own worker processes and fails if that does not finish.
        working-directory: tools/BiceValidator
        run: python build.py

      - name: Build and try the VS Code extension
        # vscode/build.py builds the language server exe and the extension, starts the
        # extension in a fresh copy of VS Code against a small mod, then packages it.
        working-directory: tools/BiceValidator/vscode
        run: python build.py

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: BiceValidator
          path: tools/BiceValidator/dist/BiceValidator.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: blackice-script
          path: tools/BiceValidator/dist/blackice-script.vsix
          if-no-files-found: error
          retention-days: 30
